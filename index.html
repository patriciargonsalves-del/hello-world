<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0b0b0f;
      color: #f5f5f7;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    #line { white-space: pre; }
    .char {
      display: inline-block;
      animation: settle 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(0.18em); filter: blur(6px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .caret {
      display: inline-block;
      width: 0.08em;
      height: 0.85em;
      margin-left: 0.08em;
      background: currentColor;
      vertical-align: -0.05em;
      animation: blink 1.15s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .caret { display: none; }
    }
  </style>
</head>
<body>
  <h1 aria-label="Hello, World">
    <span id="line" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span>
  </h1>
  <script>
    const text = "Hello, World \u{1F44B}";
    const line = document.getElementById("line");
    const caret = document.querySelector(".caret");
    const chars = [...text];

    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) {
      line.textContent = text;
      caret.remove();
    } else {
      const step = 52;
      const lead = 280;
      let i = 0;
      let start = null;
      const frame = (now) => {
        if (start === null) start = now;
        const elapsed = now - start;
        while (i < chars.length && elapsed >= lead + i * step) {
          const span = document.createElement("span");
          span.className = "char";
          span.textContent = chars[i];
          line.appendChild(span);
          i += 1;
        }
        if (i < chars.length) requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
